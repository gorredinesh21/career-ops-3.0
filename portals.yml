# Portal Scanner Configuration  (India / GenAI + Data Engineering edition)
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (4 levels):
#   0. Local parser → per-company `parser:` script for SSR/static career pages (zero-token)
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. HTTP JSON (WebFetch) → per-company `api:` on tracked_companies
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# NOTE on this config: the zero-token scanner (`node scan.mjs`) only fetches
# companies whose careers_url is a Greenhouse / Ashby / Lever / Workable /
# SmartRecruiters board (the "verified ATS boards" section below — these were
# probed and confirmed live). Indian startups on Darwinbox / Keka / Zoho /
# their own sites are listed as `scan_method: websearch`; those are picked up
# by the AGENT scan (Playwright on careers_url + the search_queries), not by
# `scan.mjs`. Run `/career-ops scan` (agent) for full coverage; `node scan.mjs`
# for a fast, free pass over the verified boards only.

# -- Location filter --  (ACTIVE — India-focused)
# always_allow is checked BEFORE block, so a multi-country posting that names
# an Indian city/region still passes even if it also lists a blocked hub.
location_filter:
  always_allow:
    - "India"
    - "Bengaluru"
    - "Bangalore"
    - "Hyderabad"
    - "Mumbai"
    - "Pune"
    - "Gurgaon"
    - "Gurugram"
    - "Noida"
    - "Delhi"
    - "Chennai"
    - "Kolkata"
  allow:
    - "Remote"
    - "Hybrid"
    - "India"
    - "Bengaluru"
    - "Bangalore"
    - "Hyderabad"
    - "Mumbai"
    - "Pune"
    - "Gurgaon"
    - "Gurugram"
    - "Noida"
    - "Delhi"
    - "Chennai"
    - "Kolkata"
    - "Ahmedabad"
    - "Indore"
    - "Jaipur"
    - "Kochi"
    - "Coimbatore"
    - "Thiruvananthapuram"
  block:
    # Foreign-only hubs. always_allow (India cities) overrides these for
    # multi-location postings. Only full, unambiguous names — no short tokens
    # like "us" that would match substrings such as "house" or "campus".
    - "United States"
    - "USA"
    - "United Kingdom"
    - "London"
    - "EMEA"
    - "Germany"
    - "Berlin"
    - "Munich"
    - "France"
    - "Paris"
    - "Singapore"
    - "Dubai"
    - "Abu Dhabi"
    - "Canada"
    - "Toronto"
    - "Vancouver"
    - "Australia"
    - "Sydney"
    - "Netherlands"
    - "Amsterdam"
    - "Spain"
    - "Madrid"
    - "Ireland"
    - "Dublin"
    - "Poland"
    - "Brazil"
    - "Philippines"

# -- Title filter --
# At least 1 positive must match AND 0 negatives must match (case-insensitive).
title_filter:
  # NOTE: matching is plain case-insensitive SUBSTRING (no word boundaries).
  # Do NOT add bare "AI" or "ML" — they match "ai" in Mumbai/Chennai/Retail and
  # "ml" in HTML/XML. Use specific multi-word phrases instead.
  positive:
    # -- GenAI / LLM / Agentic --
    - "AI Engineer"
    - "AI/ML"
    - "(AI"
    - "(ML"
    - "AI Scientist"
    - "AI Researcher"
    - "AI Developer"
    - "AI Platform"
    - "Applied AI"
    - "Generative AI"
    - "GenAI"
    - "Gen AI"
    - "Conversational AI"
    - "Voice AI"
    - "LLM"
    - "LLMOps"
    - "NLP"
    - "Agentic"
    - "Computer Vision"
    - "Prompt Engineer"
    # -- ML / DL --
    - "Machine Learning"
    - "ML Engineer"
    - "ML Scientist"
    - "MLOps"
    - "Deep Learning"
    # -- Data Engineering / Science --
    - "Data Engineer"
    - "Data Engineering"
    - "Data Scientist"
    - "Data Science"
    - "Data Platform"
    - "Analytics Engineer"
    - "Big Data"
    - "Databricks"
    - "PySpark"
    - "Spark"
    - "ETL"
    # -- Adjacent --
    - "Solutions Engineer"
    - "Forward Deployed"
    - "Platform Engineer"
    # -- General Software Engineering (added 2026-06-10: include all SWE at
    #    fresher/1yr/mid; the negative list still gates seniority + off-stack) --
    - "Software Engineer"
    - "Software Developer"
    - "Software Development Engineer"
    - "SDE"
    - "Backend"
    - "Back End"
    - "Back-End"
    - "Frontend"
    - "Front End"
    - "Front-End"
    - "Full Stack"
    - "Fullstack"
    - "Full-Stack"
    - "Web Developer"
    - "Application Developer"
    - "Programmer"
    - "DevOps"
    - "Site Reliability"
    - "SRE"
    - "Cloud Engineer"
  negative:
    # (Internships are NOW IN SCOPE — 2026-06-10 — do not re-add "Internship" here.)
    # -- Seniority above a ~3-year-min ceiling (candidate has ~1 yr exp) --
    - "Senior"
    - "Sr."
    - "Sr "
    - "Staff"
    - "Principal"
    - "Lead"
    - "Manager"
    - "Director"
    - "Head of"
    - "VP"
    - "Vice President"
    - "Architect"
    # -- Explicit high experience in title (4+ years and up) --
    - "4+ year"
    - "5+ year"
    - "6+ year"
    - "7+ year"
    - "8+ year"
    - "9+ year"
    - "10+ year"
    - "12+ year"
    - "15+ year"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
  seniority_boost:
    # These add relevance but are not required (you're targeting mid-level).
    - "Senior"
    - "Lead"
    - "II"

# -- Search queries --
# Each query triggers a WebSearch (agent scan, Level 3). Tuned for the India
# market: India job boards + startup boards + ATS boards filtered to India.
search_queries:
  # -- India job boards --
  - name: LinkedIn — India GenAI/ML/DE
    query: 'site:linkedin.com/jobs "AI Engineer" OR "Machine Learning Engineer" OR "Generative AI" OR "Data Engineer" India'
    enabled: true

  - name: Wellfound — India AI startups
    query: 'site:wellfound.com "AI" OR "Machine Learning" OR "LLM" OR "Data Engineer" India'
    enabled: true

  - name: Instahyre — India AI/ML
    query: 'site:instahyre.com "Machine Learning" OR "AI Engineer" OR "Data Engineer" OR "Generative AI"'
    enabled: true

  - name: Cutshort — India AI/ML
    query: 'site:cutshort.io "Machine Learning" OR "AI Engineer" OR "Data Engineer" OR "LLM"'
    enabled: true

  - name: foundit — India AI/ML/DE
    query: 'site:foundit.in "Machine Learning" OR "AI Engineer" OR "Data Engineer" OR "Generative AI"'
    enabled: true

  - name: Naukri — India GenAI/DE
    query: 'site:naukri.com "Generative AI" OR "LLM" OR "Machine Learning Engineer" OR "Data Engineer"'
    enabled: true

  # -- ATS boards filtered to India --
  - name: Greenhouse — India AI/DE
    query: 'site:job-boards.greenhouse.io OR site:boards.greenhouse.io "India" "AI Engineer" OR "Machine Learning" OR "Data Engineer"'
    enabled: true

  - name: Lever — India AI/DE
    query: 'site:jobs.lever.co "India" "Machine Learning" OR "AI" OR "Data Engineer"'
    enabled: true

  - name: Ashby — India AI/DE
    query: 'site:jobs.ashbyhq.com "India" "AI" OR "Machine Learning" OR "Data Engineer"'
    enabled: true

  # -- Startup / YC boards (India) --
  - name: YC Work at a Startup — India AI
    query: 'site:workatastartup.com "India" "AI" OR "Machine Learning" OR "LLM" OR "Data Engineer"'
    enabled: true

  - name: ai-jobs.net — India
    query: 'site:ai-jobs.net "India" "AI Engineer" OR "Machine Learning" OR "Data Engineer" OR "Generative AI"'
    enabled: true

