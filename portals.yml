# ============================================================
# APIFY JOB SCRAPERS  (added 2026-06-16)
# Third discovery source, alongside Telegram (TechUprise) + company sites.
# Driven by `node apify-scan.mjs` (run with NODE_OPTIONS=--use-system-ca for the
# corporate proxy). Token lives in .env (APIFY_TOKEN) — never committed.
#
# PRICING (you're on the Apify FREE tier, ~$5/month credit). Pay-per-result:
#   LinkedIn  $0.001/job          (cheapest)
#   Naukri    $0.01 start + $0.005/job
#   All-Jobs  $0.01 start + $0.0035/result (scrapes several boards per keyword)
#   Wellfound $0.20/job  ← EXCLUDED on purpose: one run blows the free budget.
# Keep the limits below modest; raise once you're comfortable with the spend.
# ============================================================
apify:
  enabled: true
  location: "India"
  geo_id: "102713980"            # LinkedIn India geoId
  date_posted_days: 7            # only jobs posted in the last N days
  experience_levels: ["2", "3"]  # LinkedIn f_E: 1=Intern 2=Entry 3=Associate 4=Mid-Senior
  naukri_experience: "1"         # Naukri: candidate years of experience (enum 0..30 | "all")
  # Keyword set covering your target archetypes. LinkedIn runs ONE combined
  # "OR" search; Naukri + All-Jobs take a single phrase, so they run once PER
  # keyword. Keep this list focused — each extra keyword adds runs (and cost).
  keywords:
    - "Generative AI"
    - "AI Engineer"
    - "Machine Learning Engineer"
    - "Data Engineer"
    - "Computer Vision"
  max_results_linkedin: 40       # total for the single LinkedIn OR search
  max_results_per_keyword: 12    # per keyword for Naukri / All-Jobs (cost control)
  actors:
    - id: "curious_coder~linkedin-jobs-scraper"
      platform: linkedin
      enabled: true
    # Naukri + All-Jobs disabled 2026-06-16 — running LinkedIn only for now.
    # Flip enabled: true to bring them back (cost goes up; see pricing note above).
    - id: "muhammetakkurtt~naukri-job-scraper"
      platform: naukri
      enabled: false
    - id: "agentx~all-jobs-scraper"
      platform: alljobs
      enabled: false
    # Wellfound intentionally disabled — $0.20/job is ~200x LinkedIn and alone
    # exceeds the free monthly credit. Re-enable only with a very low cap.
    # - id: "orgupdate~wellfound-jobs-scraper"
    #   platform: wellfound
    #   enabled: false
