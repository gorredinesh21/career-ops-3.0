# Career-Ops — Canonical States
# Source of truth for career-ops (writer) and dashboard (reader).
# Both systems MUST use these exact states.
#
# Rule: The status field in applications.md must contain EXACTLY
# one of these values (case-insensitive). No markdown bold (**),
# no dates, no extra text. Dates go in the date column.

states:
  # ── Dashboard action-tracking workflow (user-facing, shown in the dashboard) ──
  - id: no_action
    label: No Action Taken
    aliases: [no action, none, untouched, no_action_taken, evaluated-no-action]
    description: In tracker, no outreach/application action taken yet
    dashboard_group: no_action

  - id: linkedin_connect
    label: Sent LinkedIn Connect
    aliases: [linkedin connect, sent linkedin connect, linkedin, connect sent]
    description: Sent a LinkedIn connection request to someone at the company
    dashboard_group: linkedin_connect

  - id: referral
    label: Sent Referral Message
    aliases: [referral, referal, sent referral message, referral message, sent referral]
    description: Reached out to ask for a referral
    dashboard_group: referral

  - id: not_eligible
    label: Not Eligible
    aliases: [not eligible, ineligible, not_eligible]
    description: Candidate not eligible for this role
    dashboard_group: not_eligible

  # ── Evaluation-pipeline states (written by the scan/eval pipeline; kept valid) ──
  - id: evaluated
    label: Evaluated
    aliases: [evaluada]
    description: Offer evaluated with report, pending decision
    dashboard_group: evaluated

  - id: applied
    label: Applied
    aliases: [aplicado, enviada, aplicada, sent]
    description: Application submitted
    dashboard_group: applied

  - id: responded
    label: Responded
    aliases: [respondido]
    description: Company has responded (not yet interview)
    dashboard_group: responded

  - id: interview
    label: Interview
    aliases: [entrevista]
    description: Active interview process
    dashboard_group: interview

  - id: offer
    label: Offer
    aliases: [oferta]
    description: Offer received
    dashboard_group: offer

  - id: rejected
    label: Rejected
    aliases: [rechazado, rechazada]
    description: Rejected by company
    dashboard_group: rejected

  - id: discarded
    label: Discarded
    aliases: [descartado, descartada, cerrada, cancelada]
    description: Discarded by candidate or offer closed
    dashboard_group: discarded

  - id: skip
    label: SKIP
    aliases: [no_aplicar, no aplicar, skip, monitor]
    description: Doesn't fit, don't apply
    dashboard_group: skip
